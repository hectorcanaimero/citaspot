# CitaSpot — Docker Compose para Coolify
#
# Servicios EXTERNOS (otro servidor):
#   - RabbitMQ   → RABBITMQ_URL apunta a IP externa
#   - Evolution API → EVOLUTION_API_URL apunta a IP externa
#
# ── Configurar en Coolify UI ──────────────────────────────────────────────────
#   Dominios (FQDN):
#     api → api.citaspot.com (puerto 3001)
#     ai  → ai.citaspot.com  (puerto 8001)
#     web → citaspot.com     (puerto 3000)
#
# ── Variables requeridas (Coolify → Environment Variables) ────────────────────
#   POSTGRES_USER, POSTGRES_PASSWORD, REDIS_PASSWORD
#   RABBITMQ_URL, EVOLUTION_API_URL, EVOLUTION_API_KEY
#   JWT_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   WEBHOOK_SECRET
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_STARTER, STRIPE_PRICE_PRO
#   GEMINI_API_KEY, OPENAI_API_KEY
#   GITHUB_OWNER
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=citaspot
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d citaspot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb
      --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/${GITHUB_OWNER}/citaspot-api:latest
    environment:
      - SERVICE_FQDN_API
      - APP_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/citaspot?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - AI_SERVICE_URL=http://ai:8001
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WEBHOOK_URL=${SERVICE_FQDN_API}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres
      - redis

  ai:
    image: ghcr.io/${GITHUB_OWNER}/citaspot-ai:latest
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "1",
      ]
    environment:
      - SERVICE_FQDN_AI
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/citaspot?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CORE_API_URL=http://api:3001/api/v1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - postgres
      - redis

  web:
    image: ghcr.io/${GITHUB_OWNER}/citaspot-web:latest
    environment:
      - SERVICE_FQDN_WEB
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
