# Grafana — Configuración mínima para AgendAI
# La mayoría de opciones se configuran vía variables de entorno GF_*
# Este archivo solo contiene overrides que no tienen equivalente por env var

[server]
http_port = 3000

[security]
# Permite embeber dashboards en iframes (útil para el dashboard de AgendAI)
allow_embedding = true
# cookie_secure = true   # Descomentar si Grafana está detrás de HTTPS

[analytics]
reporting_enabled   = false
check_for_updates   = false
check_for_plugin_updates = false

[users]
# Sin registro público — solo el admin puede crear usuarios
allow_sign_up       = false
default_theme       = dark

[auth.anonymous]
# Sin acceso anónimo — todos deben autenticarse
enabled = false

[dashboards]
# Marcar todos los dashboards como Home por defecto
default_home_dashboard_path = /var/lib/grafana/dashboards/01_saas_overview.json

[log]
mode  = console
level = warn
