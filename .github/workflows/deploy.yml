name: Deploy

on:
  push:
    branches: [main]

# Secrets requeridos en GitHub → Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL          → https://api.citaspot.com
#   NEXT_PUBLIC_SUPABASE_URL     → https://xxxxx.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY → anon key de Supabase
#
# Nota: ghcr.io usa secrets.GITHUB_TOKEN automático (permissions: packages: write)
#
# Deploy manual en el VPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull api ai web
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d api ai web

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Construir y publicar imágenes Docker ─────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            context: apps/api
            image: citaspot-api
          - service: ai
            context: apps/ai
            image: citaspot-ai
          - service: web
            context: apps/web
            image: citaspot-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          # Build args para Next.js (ignorados por Go y Python)
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

