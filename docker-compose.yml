# CitaSpot — Ambiente de desarrollo completo
# Uso: make dev  (o: docker compose up -d)

services:
  # ── Base de Datos ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: citaspot_postgres
    environment:
      POSTGRES_DB: citaspot
      POSTGRES_USER: citaspot
      POSTGRES_PASSWORD: citaspot_dev
      POSTGRES_MULTIPLE_DATABASES: evolution # Crea DB para Evolution API
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U citaspot -d citaspot" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: citaspot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: citaspot_api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://citaspot:citaspot_dev@postgres:5432/citaspot
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://citaspot:citaspot_dev@rabbitmq:5672/
      EVOLUTION_API_URL: http://evolution:8080
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # # ── AI Service (Python) ───────────────────────────────────
  # ai:
  #   build:
  #     context: ./apps/ai
  #     dockerfile: Dockerfile.dev
  #   container_name: citaspot_ai
  #   ports:
  #     - "8001:8001"
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql://citaspot:citaspot_dev@postgres:5432/citaspot
  #     REDIS_URL: redis://redis:6379
  #     RABBITMQ_URL: amqp://citaspot:citaspot_dev@rabbitmq:5672/
  #     CORE_API_URL: http://api:3001/api/v1
  #   volumes:
  #     - ./apps/ai:/app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: unless-stopped

  # # ── Web (Next.js) ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: citaspot_web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: https://api.citaspot.com
      PORT: "3000" # Sobrescribe el PORT=3001 del .env que es para el API Go
    volumes:
      - ./apps/web:/app
      - /app/node_modules # Excluir node_modules del bind mount
      - /app/.next # Excluir .next del bind mount
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
