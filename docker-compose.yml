# CitaSpot — Ambiente de desarrollo completo
# Uso: make dev  (o: docker compose up -d)

services:
  # ── Base de Datos ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: citaspot_postgres
    environment:
      POSTGRES_DB: citaspot
      POSTGRES_USER: citaspot
      POSTGRES_PASSWORD: citaspot_dev
      POSTGRES_MULTIPLE_DATABASES: evolution # Crea DB para Evolution API
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citaspot -d citaspot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: citaspot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # ── Message Queue ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: citaspot_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # UI de administración
    environment:
      RABBITMQ_DEFAULT_USER: citaspot
      RABBITMQ_DEFAULT_PASS: citaspot_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # ── WhatsApp (Evolution API) ──────────────────────────────
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: citaspot_evolution
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: dev-evolution-api-key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://citaspot:citaspot_dev@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_REDIS_TTL: "604800"
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
      # Webhook global — todos los eventos van al Core API con el global API key
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:3001/api/v1/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_GLOBAL_HEADERS: '{"apikey":"dev-evolution-api-key"}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Core API (Go) ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: citaspot_api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://citaspot:citaspot_dev@postgres:5432/citaspot
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://citaspot:citaspot_dev@rabbitmq:5672/
      EVOLUTION_API_URL: http://evolution:8080
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── AI Service (Python) ───────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile.dev
    container_name: citaspot_ai
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://citaspot:citaspot_dev@postgres:5432/citaspot
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://citaspot:citaspot_dev@rabbitmq:5672/
      CORE_API_URL: http://api:3001/api/v1
    volumes:
      - ./apps/ai:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Web (Next.js) ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: citaspot_web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PORT: "3000" # Sobrescribe el PORT=3001 del .env que es para el API Go
    volumes:
      - ./apps/web:/app
      - /app/node_modules # Excluir node_modules del bind mount
      - /app/.next # Excluir .next del bind mount
    depends_on:
      - api
    restart: unless-stopped

  # ── Reportes (Grafana) ────────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: citaspot_grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_admin}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_dev}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
